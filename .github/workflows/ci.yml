name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  publish:
    name: Publish (VS Marketplace + Open VSX)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .vsix
        run: npm run vsix
      - name: Publish to Visual Studio Marketplace
        run: npm run deploy:vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npm run deploy:openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: copy-github-permalink.vsix
          generate_release_notes: true
