name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  # Manual re-run of the publish job, e.g. after one marketplace was down.
  # Each publish step skips a version that is already live, so this is safe to repeat.
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  publish:
    name: Publish (VS Marketplace + Open VSX)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build .vsix
        run: npm run vsix
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          live=$(npx vsce show tejanium.copy-github-permalink --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).versions.some(v => v.version === process.env.VERSION)")
          if [ "$live" = "true" ]; then
            echo "v$VERSION is already on the VS Marketplace, skipping."
          else
            npm run deploy:vscode
          fi
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -sf -o /dev/null "https://open-vsx.org/api/tejanium/copy-github-permalink/$VERSION"; then
            echo "v$VERSION is already on Open VSX, skipping."
          else
            npm run deploy:openvsx
          fi
      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: copy-github-permalink.vsix
          generate_release_notes: true
